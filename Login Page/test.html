<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Modern Login Form - Clean & Responsive Design'>
    <title>Tawsif Profile</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <!-- Navigation Header -->
     <header>
         <h2 class="logo">SRT</h2>
            
            <nav class="nav-menu">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <button class="btnLogin-popup login-btn">Login</button>
            </nav>
        
        </header>
        <main class="main-content">
            <div class="wrapper">
                <div class="form-box login active">
                    <h2>Login</h2>
                    <form id="loginForm" action="#">
                        <div class="input-box">
                            <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                            <input id="email" name="email" type="email" required placeholder=" ">
                            <label for="email">Email</label>
                            <span id="emailError" class="error-text"></span>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input id="password" name="password" type="password" required placeholder=" ">
                            <label for="password">Password</label>
                            <button type="button" class="toggle-password" aria-label="Show password"><ion-icon name="eye-outline"></ion-icon></button>
                            <span id="passwordError" class="error-text"></span>
                        </div>
                        <div class="remember-forgot">
                            <label><input type="checkbox"> Remember me</label>
                            <a href="#">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn submit-btn">Login</button>
                        <div class="login-register">
                            <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
                        </div>
                    </form>
                </div>
                <div class="form-box register">
                    <h2>Register</h2>
                    <form id="registerForm" action="#">
                        <div class="input-box">
                            <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                            <input id="registerName" name="name" type="text" required placeholder=" ">
                            <label for="registerName">Full Name</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                            <input id="registerEmail" name="email" type="email" required placeholder=" ">
                            <label for="registerEmail">Email</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input id="registerPassword" name="password" type="password" required placeholder=" ">
                            <label for="registerPassword">Password</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input id="registerConfirm" name="confirmPassword" type="password" required placeholder=" ">
                            <label for="registerConfirm">Confirm Password</label>
                        </div>
                        <button type="submit" class="btn submit-btn">Register</button>
                        <div class="login-register">
                            <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
