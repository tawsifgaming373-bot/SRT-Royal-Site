name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_MONGODB_URI: mongodb://127.0.0.1:27017/srt-royal-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          echo "::group::Full test output"
          cat test-output.log
          echo "::endgroup::"
          if [ $code -ne 0 ]; then
            TAIL=$(tail -c 4000 test-output.log)
            ESCAPED=$(echo "$TAIL" | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g;s/%/%25/g')
            echo "::error::npm test failed (exit $code). Tail of output:%0A$ESCAPED"
            exit $code
          fi
